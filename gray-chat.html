<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171533">
  <title>宇宙對講機｜聯絡小灰</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #171533;
      color: #fff9e9;
      --ink: #171533;
      --cream: #fff9e9;
      --yellow: #ffe66d;
      --pink: #ff829b;
      --mint: #91f3d0;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 74%, #39345d 0, transparent 42%),
        radial-gradient(ellipse at 16% 28%, #31284d 0, transparent 34%),
        #171533;
    }

    .page {
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      padding: 0 clamp(20px, 6vw, 92px) 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 28px 0;
    }

    .brand {
      color: var(--cream);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: .08em;
      text-decoration: none;
    }

    .top-note {
      padding: 8px 14px;
      border: 1px solid rgb(255 249 233 / 35%);
      border-radius: 999px;
      color: #e8e4f2;
      font-size: 15px;
    }

    .chat-card {
      display: flex;
      width: min(760px, 100%);
      min-height: min(720px, calc(100svh - 125px));
      flex: 1;
      flex-direction: column;
      align-self: center;
      overflow: hidden;
      border: 2px solid rgb(255 249 233 / 20%);
      border-radius: 26px;
      background: rgb(35 32 67 / 92%);
      box-shadow: 0 18px 60px rgb(0 0 0 / 24%);
    }

    .chat-heading {
      display: flex;
      align-items: center;
      gap: 17px;
      padding: 21px 25px;
      border-bottom: 1px solid rgb(255 249 233 / 15%);
    }

    .avatar {
      width: 63px;
      height: 63px;
      flex: 0 0 auto;
      border: 2px solid var(--mint);
      border-radius: 50%;
      background: #35344d;
      object-fit: cover;
    }

    .chat-heading h1 {
      margin: 0;
      color: var(--yellow);
      font-size: clamp(22px, 4vw, 30px);
    }

    .chat-heading p {
      margin: 5px 0 0;
      color: #d3d0e2;
      font-size: 15px;
    }

    .messages {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: min(82%, 520px);
      padding: 13px 16px;
      border-radius: 18px;
      font-size: 17px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message--gray {
      align-self: flex-start;
      border: 1px solid rgb(145 243 208 / 55%);
      border-top-left-radius: 5px;
      background: #343253;
    }

    .message--user {
      align-self: flex-end;
      border-top-right-radius: 5px;
      background: var(--yellow);
      color: var(--ink);
    }

    .message--status {
      align-self: flex-start;
      padding: 0 4px;
      color: #c9c4da;
      font-size: 14px;
    }

    .composer {
      display: flex;
      gap: 11px;
      padding: 17px 20px;
      border-top: 1px solid rgb(255 249 233 / 15%);
      background: rgb(23 21 51 / 45%);
    }

    .composer input {
      min-width: 0;
      min-height: 52px;
      flex: 1;
      padding: 0 16px;
      border: 2px solid rgb(255 249 233 / 30%);
      border-radius: 15px;
      background: #201e3c;
      color: var(--cream);
      font: inherit;
      font-size: 16px;
    }

    .composer input:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 2px;
    }

    .composer button {
      min-width: 92px;
      min-height: 52px;
      padding: 0 18px;
      border: 2px solid var(--ink);
      border-radius: 15px;
      background: var(--yellow);
      box-shadow: 3px 4px 0 var(--cream);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
    }

    .composer button:hover { background: #fff08e; }
    .composer button:disabled { cursor: wait; opacity: .65; }

    .composer button:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 5px;
    }

    .setup-note {
      margin: 0;
      padding: 0 20px 14px;
      color: #c9c4da;
      font-size: 13px;
      line-height: 1.5;
    }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      .page { padding: 0 12px 12px; }
      .topbar { padding: 21px 8px; }
      .brand { font-size: 16px; }
      .top-note { font-size: 13px; }
      .chat-card { min-height: calc(100svh - 91px); border-radius: 20px; }
      .chat-heading { padding: 17px; }
      .avatar { width: 53px; height: 53px; }
      .messages { padding: 18px 14px; }
      .composer { gap: 8px; padding: 13px 12px; }
      .composer button { min-width: 75px; padding: 0 12px; }
      .setup-note { padding-inline: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./sneak-gray.html">← 回到小灰的頁面</a>
      <span class="top-note">✷　宇宙對講機　✷</span>
    </header>

    <section class="chat-card" aria-label="和小灰聊天">
      <header class="chat-heading">
        <img class="avatar" src="./灰雞正面.png" alt="小灰">
        <div>
          <h1>小灰</h1>
          <p>外星訊號已接通，咕。</p>
        </div>
      </header>
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="message message--gray">咕咕？訊號接通了。你有什麼事？</div>
      </div>
      <form class="composer" id="chat-form">
        <input id="chat-input" type="text" maxlength="1000" autocomplete="off" placeholder="輸入訊息給小灰..." aria-label="輸入訊息給小灰" required>
        <button id="send-button" type="submit">發送</button>
      </form>
      <p class="setup-note" id="setup-note" hidden>尚未設定小灰的 AI 連線，請在 gray-chat.html 設定 Apps Script Web App 網址。</p>
    </section>
  </main>
  <script>
    const CHAT_API_URL = "https://script.google.com/macros/s/AKfycbwFyjUPPHt_ERkPEKruQUXD13blwP75yLYdiUZGxwaDTPyWHOnDcfeJntHOkNd1JIno/exec";
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("messages");
    const setupNote = document.getElementById("setup-note");
    const sessionId = getSessionId();

    if (!CHAT_API_URL) {
      setupNote.hidden = false;
      input.placeholder = "小灰的訊號還沒接上...";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      appendMessage(message, "user");
      input.value = "";
      sendButton.disabled = true;
      input.disabled = true;
      const pending = appendMessage("小灰正在接收訊號...", "status");

      try {
        if (!CHAT_API_URL) throw new Error("尚未設定 Apps Script Web App 網址。");
        const apiUrl = new URL(CHAT_API_URL);
        apiUrl.searchParams.set("action", "chat");
        const response = await fetch(apiUrl, {
          method: "POST",
          body: new URLSearchParams({ sessionId, message })
        });
        if (!response.ok) throw new Error(`伺服器回應 ${response.status}`);
        const result = await response.json();
        if (result.error) throw new Error(result.error);
        if (typeof result.reply !== "string" || !result.reply.trim()) {
          throw new Error("小灰沒有回傳訊息，請稍後再試。");
        }
        pending.remove();
        appendMessage(result.reply, "gray");
      } catch (error) {
        pending.remove();
        appendMessage(`訊號中斷：${error.message}`, "status");
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    function appendMessage(text, sender) {
      const message = document.createElement("div");
      message.className = `message message--${sender}`;
      message.textContent = text;
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    function getSessionId() {
      const key = "gray-chat-session";
      let id = sessionStorage.getItem(key);
      if (!id) {
        id = window.crypto && typeof window.crypto.randomUUID === "function"
          ? window.crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        sessionStorage.setItem(key, id);
      }
      return id;
    }
  </script>
</body>
</html>
